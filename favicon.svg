<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Sharp angular background - NO rounded corners -->
  <defs>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0115f"/>
      <stop offset="100%" stop-color="#8b0028"/>
    </linearGradient>
    <clipPath id="cut">
      <polygon points="0,4 4,0 28,0 32,4 32,28 28,32 4,32 0,28"/>
    </clipPath>
  </defs>
  <rect width="32" height="32" fill="url(#rubyGrad)" clip-path="url(#cut)"/>
  <!-- Double border effect -->
  <polygon points="1,5 5,1 27,1 31,5 31,27 27,31 5,31 1,27" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
  <!-- Letter R -->
  <text x="16" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">R</text>
  <!-- Ruby diamond sparkle -->
  <polygon points="25,5 27,7 25,9 23,7" fill="rgba(255,255,255,0.5)"/>
</svg>
